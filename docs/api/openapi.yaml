openapi: 3.0.3
info:
  title: API Invoice Reconciliation & Exception Agent
  version: 1.0.0
  description: |
    Kontrak antara Frontend (Vue 3) dan Backend (NestJS). Versi draf untuk disetujui bersama.

    **Konvensi**
    - Semua respons JSON. Nama field `snake_case`.
    - Uang: bilangan bulat Rupiah (tanpa desimal, bukan float). Contoh: `7775000`.
    - Waktu: ISO 8601 UTC, misalnya `2026-10-31T01:14:00Z`. FE menampilkannya dalam WIB.
    - Skor keyakinan: angka 0 sampai 1, misalnya `0.86`. FE menampilkan `0,86`.
    - Autentikasi: header `Authorization: Bearer <access_token>` pada semua endpoint kecuali login.
    - Daftar berpaginasi: `{ "data": [...], "meta": { page, page_size, total, total_pages } }`.
    - Error seragam: `{ "error": { "code", "message", "details"? } }`.
    - Tiga status dipisah: `processing_status`, `verdict`, `decision_status`.
    - `allowed_actions` pada invoice sudah dihitung server untuk pengguna yang sedang login. FE cukup
      menampilkan tombol sesuai isi array ini, tanpa menduplikasi aturan peran.

    **Peran:** `STAF_FINANCE`, `VERIFIKATOR`, `ADMIN`. Hak akses dijaga di server.
servers:
  - url: http://localhost:3000/api
    description: Lokal
  - url: http://localhost:4010
    description: Server tiruan (Prism) dari berkas ini. Alamat server demo diberikan BE saat siap.
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Dasbor
  - name: Batch
  - name: Invoice
  - name: Laporan
  - name: Admin
  - name: Demo
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: staf@demo.id
              password: sandi-demo
      responses:
        '200':
          description: Berhasil masuk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Email atau kata sandi salah, atau akun nonaktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email atau kata sandi salah.
  /me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard/summary:
    get:
      tags: [Dasbor]
      summary: Ringkasan Dasbor sesuai peran
      description: |
        Isi menyesuaikan peran. Staf: `my_queue_count` = invoice PENDING berverdict CLEAN, EXCEPTION, DUPLICATE.
        Verifikator: `my_queue_count` = NEEDS_REVIEW + ESCALATED yang belum diputuskan.
        Admin: `my_queue_count` = 0 dan `active_users_by_role` terisi.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /batches:
    get:
      tags: [Batch]
      summary: Daftar batch
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Batch]
      summary: Unggah batch invoice (hanya STAF_FINANCE)
      description: |
        `multipart/form-data`. Hanya berkas invoice (PDF, JPG, PNG). PO dan GRN tidak diunggah di sini.
        Batas: maksimal 50 berkas per batch dan 10 MB per berkas (nilai awal; BE dapat menyesuaikan).
        Berkas yang tidak lolos validasi dikembalikan di `rejected` dan tidak diproses. Invoice yang diterima
        langsung dibuat dengan `processing_status = QUEUED`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                name:
                  type: string
                  description: Nama batch (opsional)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Batch dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /batches/{batch_id}:
    get:
      tags: [Batch]
      summary: Rincian satu batch
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices:
    get:
      tags: [Invoice]
      summary: Daftar invoice (juga dipakai untuk polling status)
      description: |
        Dipanggil ulang tiap 2 sampai 3 detik selama masih ada invoice berstatus QUEUED atau PROCESSING.
        `queue=mine` hanya mengembalikan invoice yang menunggu keputusan peran pengguna:
        Staf = PENDING berverdict CLEAN, EXCEPTION, DUPLICATE. Verifikator = NEEDS_REVIEW atau ESCALATED yang belum diputuskan.
      parameters:
        - name: batch_id
          in: query
          schema:
            type: string
        - name: queue
          in: query
          schema:
            type: string
            enum: [mine]
        - name: processing_status
          in: query
          schema:
            $ref: '#/components/schemas/ProcessingStatus'
        - name: verdict
          in: query
          schema:
            $ref: '#/components/schemas/Verdict'
        - name: decision_status
          in: query
          schema:
            $ref: '#/components/schemas/DecisionStatus'
        - name: vendor_id
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Cari nomor invoice
          schema:
            type: string
        - name: sort
          in: query
          description: 'Contoh: `-created_at`, `-difference_amount`, `confidence`. Awalan `-` berarti menurun.'
          schema:
            type: string
            default: -created_at
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceListItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invoices/{invoice_id}:
    get:
      tags: [Invoice]
      summary: Rincian invoice untuk Kartu keputusan
      description: |
        Bagian yang tidak relevan bernilai `null` (misalnya `duplicate` pada invoice yang bukan DUPLICATE,
        atau seluruh bagian analisis saat invoice masih diproses). FE menyembunyikan bagian bernilai `null`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
              examples:
                exception:
                  summary: Invoice EXCEPTION (harga naik dan jumlah kurang)
                  value:
                    id: inv_0412
                    batch_id: bat_0031
                    invoice_number: INV-2026-0412
                    vendor_id: ven_003
                    vendor_name: PT Sinar Kertas Nusantara
                    po_number: PO-0012
                    invoice_date: '2026-10-28'
                    total_amount: 7775000
                    difference_amount: 640000
                    processing_status: DONE
                    iteration: 3
                    verdict: EXCEPTION
                    confidence: 0.86
                    decision_status: PENDING
                    queue_owner: STAF_FINANCE
                    review_reason: null
                    allowed_actions: [APPROVE, REJECT, ESCALATE]
                    created_at: '2026-10-31T01:12:00Z'
                    processed_at: '2026-10-31T01:14:00Z'
                    file:
                      content_type: application/pdf
                      page_count: 2
                      url: /api/invoices/inv_0412/file
                    processing:
                      started_at: '2026-10-31T01:12:20Z'
                      finished_at: '2026-10-31T01:14:00Z'
                      duration_ms: 100000
                      error_message: null
                    extraction:
                      fields:
                        - key: vendor_name
                          label: Vendor
                          value: PT Sinar Kertas Nusantara
                          confidence: 0.99
                        - key: invoice_number
                          label: No. invoice
                          value: INV-2026-0412
                          confidence: 0.98
                        - key: po_number
                          label: Referensi PO
                          value: PO-0012
                          confidence: 0.95
                        - key: total_amount
                          label: Total
                          value: '7775000'
                          confidence: 0.71
                    comparison:
                      tolerance_pct: 0.5
                      lines:
                        - line_no: 1
                          item_name: Kertas A4 80gr (rim)
                          po:
                            quantity: 100
                            unit_price: 58000
                          grn:
                            quantity_received: 100
                          invoice:
                            quantity: 100
                            unit_price: 62000
                          status: MISMATCH
                          diffs:
                            - type: PRICE
                              expected: 58000
                              actual: 62000
                              delta: 4000
                              delta_pct: 6.9
                              within_tolerance: false
                        - line_no: 2
                          item_name: Map folder
                          po:
                            quantity: 50
                            unit_price: 7500
                          grn:
                            quantity_received: 50
                          invoice:
                            quantity: 50
                            unit_price: 7500
                          status: MATCH
                          diffs: []
                        - line_no: 3
                          item_name: Tinta printer
                          po:
                            quantity: 10
                            unit_price: 120000
                          grn:
                            quantity_received: 8
                          invoice:
                            quantity: 10
                            unit_price: 120000
                          status: MISMATCH
                          diffs:
                            - type: QUANTITY
                              expected: 8
                              actual: 10
                              delta: 2
                              delta_pct: 25.0
                              within_tolerance: false
                      totals:
                        po_total: 7375000
                        grn_total_at_po_price: 7135000
                        invoice_total: 7775000
                        difference: 640000
                    tax_check:
                      items:
                        - key: serial_number
                          label: Nomor seri faktur pajak
                          result: PASS
                          detail: Belum pernah dipakai
                        - key: npwp
                          label: NPWP
                          result: PASS
                          detail: Sesuai master vendor
                        - key: ppn
                          label: PPN
                          result: PASS
                          detail: Sesuai perhitungan
                    duplicate: null
                    investigation:
                      iterations: 3
                      max_iterations: 3
                      steps:
                        - step: 1
                          hypothesis: Harga di invoice lebih tinggi dari PO.
                          tool: lookup_po_detail
                          tool_args_summary: PO-0012
                          result_summary: Harga PO Kertas A4 Rp 58.000.
                          duration_ms: 4200
                        - step: 2
                          hypothesis: Ada klausul kenaikan harga yang menyetujui.
                          tool: tarik_kontrak_vendor
                          tool_args_summary: ven_003, klausul harga
                          result_summary: Pasal 4.2 mensyaratkan pemberitahuan tertulis 30 hari; tidak ada pemberitahuan.
                          duration_ms: 6100
                        - step: 3
                          hypothesis: Jumlah tinta yang diterima kurang.
                          tool: cek_grn_status
                          tool_args_summary: PO-0012
                          result_summary: Tinta printer diterima 8 dari 10.
                          duration_ms: 3300
                    finding:
                      summary: Invoice menagih Kertas A4 Rp 62.000 padahal PO Rp 58.000, dan menagih 10 tinta printer padahal hanya 8 yang diterima. Selisih total Rp 640.000.
                      recommendation: Tolak dan minta vendor menerbitkan koreksi invoice.
                      confidence: 0.86
                      labels:
                        - type: FACT
                          text: Dua selisih terkonfirmasi (harga dan jumlah).
                        - type: HYPOTHESIS
                          text: Kenaikan harga tanpa persetujuan.
                      evidence:
                        - source_type: PO
                          source_ref: PO-0012
                          page: 1
                          quote: Kertas A4 80gr, 100 rim @ Rp58.000
                        - source_type: CONTRACT
                          source_ref: Kontrak PT Sinar Kertas Nusantara
                          page: 3
                          quote: Perubahan harga wajib diberitahukan tertulis 30 hari sebelumnya (pasal 4.2).
                        - source_type: GRN
                          source_ref: GRN-0087
                          page: 1
                          quote: Tinta printer, diterima 8 unit
                    escalation: null
                    decisions:
                      - id: dec_0001
                        actor:
                          type: AGENT
                          id: agent
                          name: Agent
                        action: PROCESSED
                        reason: Selesai diproses, verdict EXCEPTION
                        created_at: '2026-10-31T01:14:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice_id}/file:
    get:
      tags: [Invoice]
      summary: Berkas asli invoice (PDF atau gambar)
      description: |
        Butuh header Authorization, jadi FE mengambilnya sebagai blob (fetch/axios `responseType: blob`)
        lalu menampilkannya di penampil. Jangan memakai tag `<img src>` atau `<iframe src>` langsung.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Berkas
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice_id}/decision:
    post:
      tags: [Invoice]
      summary: Ambil keputusan (Setujui, Tolak, Eskalasi)
      description: |
        Aturan (dicek server):
        - STAF_FINANCE: APPROVE, REJECT, atau ESCALATE pada invoice PENDING berverdict CLEAN, EXCEPTION, atau DUPLICATE.
        - VERIFIKATOR: APPROVE atau REJECT pada invoice NEEDS_REVIEW atau ESCALATED. Keputusan final.
        - ADMIN: tidak boleh.
        - `reason` wajib. Invoice yang sudah APPROVED atau REJECTED tidak dapat diputuskan lagi.
        Pelanggaran peran mengembalikan 403 `FORBIDDEN`; pelanggaran status mengembalikan 409 `INVALID_TRANSITION`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            example:
              action: REJECT
              reason: Harga tidak sesuai PO dan jumlah tinta melebihi yang diterima.
      responses:
        '200':
          description: Keputusan tersimpan. Mengembalikan rincian invoice terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Status invoice tidak mengizinkan aksi ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_TRANSITION
                  message: Invoice sudah diputuskan dan tidak dapat diubah.
  /invoices/{invoice_id}/retry:
    post:
      tags: [Invoice]
      summary: Coba ulang invoice yang gagal diproses (P1; STAF_FINANCE atau ADMIN)
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '202':
          description: Dimasukkan kembali ke antrean (processing_status menjadi QUEUED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invoice tidak berstatus FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/metrics:
    get:
      tags: [Laporan]
      summary: Metrik efisiensi (P1)
      description: |
        Dapat dilihat semua peran. Semua angka dihitung dari data nyata dalam cakupan filter (`batch_id`, `from`, `to` = tanggal unggah, WIB).
        - `invoices_total`: semua invoice, termasuk yang belum selesai atau gagal.
        - `avg_processing_seconds`: rata-rata durasi invoice yang selesai (DONE).
        - `auto_clear_percent`: persen invoice DONE berverdict CLEAN. Tetap menunggu persetujuan manusia.
        - `difference_caught_total`: jumlah selisih Rupiah pada invoice EXCEPTION dan NEEDS_REVIEW.
        - `escalation_rate_percent`: persen invoice DONE yang pernah dieskalasi Staf.
        - `by_vendor`: 10 vendor dengan total selisih EXCEPTION terbesar.
        - `estimated_hours_saved`: perkiraan, (invoice DONE x menit manual per invoice) / 60. Null bila Admin belum mengisi menitnya.
        Bila tidak ada data pada rentang itu, semua angka bernilai 0 (bukan error).
      parameters:
        - name: batch_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings:
    get:
      tags: [Admin]
      summary: Pengaturan aturan (semua peran boleh membaca; hanya ADMIN yang boleh mengubah)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Admin]
      summary: Ubah pengaturan (ADMIN)
      description: Nilai baru berlaku untuk batch berikutnya. Setiap invoice menyimpan nilai yang dipakainya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users:
    get:
      tags: [Admin]
      summary: Daftar pengguna (ADMIN)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Tambah pengguna (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email sudah dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{user_id}:
    patch:
      tags: [Admin]
      summary: Ubah peran atau status aktif (ADMIN). Akun sendiri tidak boleh dinonaktifkan atau diturunkan perannya.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /audit-logs:
    get:
      tags: [Admin]
      summary: Jejak audit (ADMIN). Hanya bertambah, tidak ada ubah atau hapus.
      parameters:
        - name: actor_type
          in: query
          schema:
            type: string
            enum: [USER, AGENT]
        - name: action
          in: query
          schema:
            type: string
            enum: [LOGIN, INVOICE_UPLOADED, INVOICE_PROCESSED, INVOICE_RETRY, DECISION_APPROVE, DECISION_REJECT, DECISION_ESCALATE, SETTINGS_UPDATED, USER_CREATED, USER_UPDATED, MASTER_IMPORTED, DEMO_RESET]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /master/{type}:
    get:
      tags: [Admin]
      summary: Data master (ADMIN)
      description: |
        Isi `data` berbeda per `type`. FE membuat kolom tabel dari `columns` tanpa menulis ulang daftar kolom.
        Kolom per jenis:
        - `vendors`: id, name, npwp, payment_terms_days, has_contract
        - `items`: id, sku, name, unit
        - `purchase-orders` (satu baris per baris PO): po_number, po_date, vendor_name, line_no, item_name, quantity, unit_price
        - `goods-receipts` (satu baris per baris penerimaan): grn_number, po_number, received_date, line_no, item_name, quantity_received
        Uang berupa bilangan bulat Rupiah. Data master dapat dibaca ADMIN dan dipakai agent secara baca-saja.
      parameters:
        - $ref: '#/components/parameters/MasterType'
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [columns, data, meta]
                properties:
                  columns:
                    type: array
                    description: Urutan dan label kolom untuk tabel
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /master/{type}/import:
    post:
      tags: [Admin]
      summary: Impor CSV data master (ADMIN)
      description: |
        Dengan `dry_run=true`, server hanya memvalidasi dan mengembalikan pratinjau tanpa menyimpan.
        Format berkas: CSV, UTF-8, pemisah koma, baris pertama berisi nama kolom persis seperti daftar kolom
        pada `GET /master/{type}`. Maksimal 5 MB. Baris dengan `id` yang sudah ada memperbarui data; baris baru ditambahkan.
        Baris yang tidak valid dilaporkan di `errors` dan tidak disimpan; baris valid tetap disimpan bila `dry_run=false`.
      parameters:
        - $ref: '#/components/parameters/MasterType'
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Hasil validasi atau impor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: Belum tersedia pada versi ini. Data master diisi lewat seed. FE boleh menyembunyikan tombol impor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_IMPLEMENTED
                  message: Impor CSV belum tersedia. Data master diisi lewat seed.
  /demo/sample-batch:
    post:
      tags: [Demo]
      summary: Muat batch contoh (data sintetis) untuk demo (STAF_FINANCE)
      responses:
        '201':
          description: Batch contoh dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /demo/reset:
    post:
      tags: [Demo]
      summary: Atur ulang data demo (ADMIN)
      description: Menghapus batch dan keputusan, lalu mengisi ulang data master sintetis.
      responses:
        '204':
          description: Selesai
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
    MasterType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [vendors, items, purchase-orders, goods-receipts]
  responses:
    Unauthorized:
      description: Token tidak ada, salah, atau kedaluwarsa. FE mengarahkan ke Login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Sesi berakhir, silakan masuk lagi.
    Forbidden:
      description: Peran tidak berwenang. FE menampilkan halaman 403.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Anda tidak berwenang melakukan aksi ini.
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Data tidak ditemukan.
    ValidationError:
      description: Input tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Alasan wajib diisi.
              details:
                - field: reason
                  message: Alasan wajib diisi.
  schemas:
    Role:
      type: string
      enum: [STAF_FINANCE, VERIFIKATOR, ADMIN]
    ProcessingStatus:
      type: string
      enum: [QUEUED, PROCESSING, DONE, FAILED]
    Verdict:
      type: string
      description: Hanya terisi setelah processing_status = DONE.
      enum: [CLEAN, EXCEPTION, DUPLICATE, NEEDS_REVIEW]
    DecisionStatus:
      type: string
      enum: [PENDING, ESCALATED, APPROVED, REJECTED]
    DecisionAction:
      type: string
      enum: [APPROVE, REJECT, ESCALATE]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 'Contoh: UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, INVALID_TRANSITION, INVALID_CREDENTIALS, DUPLICATE_FILE'
            message:
              type: string
              description: Pesan berbahasa Indonesia yang aman ditampilkan ke pengguna.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Detik
          example: 28800
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, name, email, role, is_active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
    UserCreate:
      type: object
      required: [name, email, role, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          minLength: 8
    UserUpdate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
    Batch:
      type: object
      required: [id, name, created_at, total, completed, status, counts]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Nama pengguna yang mengunggah
        total:
          type: integer
          description: Jumlah invoice yang diterima
        completed:
          type: integer
          description: Jumlah invoice dengan processing_status DONE atau FAILED
        status:
          type: string
          enum: [PROCESSING, DONE]
        counts:
          $ref: '#/components/schemas/BatchCounts'
    BatchCounts:
      type: object
      required: [clean, exception, duplicate, needs_review, failed, pending_decision]
      properties:
        clean:
          type: integer
        exception:
          type: integer
        duplicate:
          type: integer
        needs_review:
          type: integer
        failed:
          type: integer
        pending_decision:
          type: integer
          description: Invoice yang belum APPROVED atau REJECTED
    UploadResult:
      type: object
      required: [batch, accepted, rejected]
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        accepted:
          type: array
          items:
            type: object
            required: [file_name, invoice_id]
            properties:
              file_name:
                type: string
              invoice_id:
                type: string
        rejected:
          type: array
          items:
            type: object
            required: [file_name, reason]
            properties:
              file_name:
                type: string
              reason:
                type: string
                enum: [DUPLICATE_FILE, UNSUPPORTED_TYPE, TOO_LARGE]
    DashboardSummary:
      type: object
      required: [latest_batch, my_queue_count, recent_batches]
      properties:
        latest_batch:
          allOf:
            - $ref: '#/components/schemas/Batch'
          nullable: true
        my_queue_count:
          type: integer
        needs_review_count:
          type: integer
          description: Khusus VERIFIKATOR
        escalated_count:
          type: integer
          description: Khusus VERIFIKATOR
        decided_today:
          type: object
          description: Khusus VERIFIKATOR
          properties:
            approved:
              type: integer
            rejected:
              type: integer
        active_users_by_role:
          type: object
          description: Khusus ADMIN
          additionalProperties:
            type: integer
        recent_batches:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
    InvoiceListItem:
      type: object
      required: [id, batch_id, processing_status, decision_status, allowed_actions, created_at]
      properties:
        id:
          type: string
        batch_id:
          type: string
        invoice_number:
          type: string
          nullable: true
          description: Null bila belum terbaca (QUEUED, PROCESSING, atau gagal ekstraksi)
        vendor_id:
          type: string
          nullable: true
        vendor_name:
          type: string
          nullable: true
        po_number:
          type: string
          nullable: true
        invoice_date:
          type: string
          format: date
          nullable: true
        total_amount:
          type: integer
          nullable: true
          description: Rupiah bulat
        difference_amount:
          type: integer
          nullable: true
          description: Selisih total invoice terhadap nilai yang seharusnya, dalam Rupiah. Null bila belum dihitung.
        processing_status:
          $ref: '#/components/schemas/ProcessingStatus'
        iteration:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3
          description: Iterasi investigasi saat ini (0 sampai 3). FE menampilkan "n dari 3" saat PROCESSING.
        verdict:
          type: string
          nullable: true
          description: Null sampai processing_status = DONE.
          enum: [CLEAN, EXCEPTION, DUPLICATE, NEEDS_REVIEW, null]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        decision_status:
          $ref: '#/components/schemas/DecisionStatus'
        queue_owner:
          type: string
          enum: [STAF_FINANCE, VERIFIKATOR, null]
          nullable: true
          description: Siapa yang berhak memutuskan sekarang. Null bila sudah APPROVED atau REJECTED, atau belum selesai diproses.
        review_reason:
          type: string
          nullable: true
          description: 'Alasan masuk antrean Verifikator, misalnya "Eskalasi dari Staf", "Keyakinan rendah (0,52)", "Percobaan investigasi habis".'
        allowed_actions:
          type: array
          description: Aksi keputusan yang boleh dilakukan pengguna yang sedang login pada invoice ini. Kosong bila hanya boleh melihat.
          items:
            $ref: '#/components/schemas/DecisionAction'
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/InvoiceListItem'
        - type: object
          properties:
            file:
              type: object
              properties:
                content_type:
                  type: string
                  example: application/pdf
                page_count:
                  type: integer
                url:
                  type: string
                  description: Jalur relatif ke endpoint berkas. Ambil sebagai blob dengan token.
            processing:
              type: object
              properties:
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
                duration_ms:
                  type: integer
                  nullable: true
                error_message:
                  type: string
                  nullable: true
            extraction:
              type: object
              nullable: true
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [key, label, value, confidence]
                    properties:
                      key:
                        type: string
                      label:
                        type: string
                      value:
                        type: string
                      confidence:
                        type: number
            comparison:
              $ref: '#/components/schemas/Comparison'
            tax_check:
              type: object
              nullable: true
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [key, label, result]
                    properties:
                      key:
                        type: string
                      label:
                        type: string
                      result:
                        type: string
                        enum: [PASS, FAIL, NA]
                      detail:
                        type: string
                        nullable: true
            duplicate:
              type: object
              nullable: true
              description: Terisi hanya bila verdict = DUPLICATE
              properties:
                original_invoice_id:
                  type: string
                original_invoice_number:
                  type: string
                original_total_amount:
                  type: integer
                original_created_at:
                  type: string
                  format: date-time
                match_basis:
                  type: array
                  description: 'Dasar kecocokan, misalnya ["invoice_number", "total_amount", "vendor"]'
                  items:
                    type: string
            investigation:
              type: object
              nullable: true
              properties:
                iterations:
                  type: integer
                max_iterations:
                  type: integer
                steps:
                  type: array
                  items:
                    type: object
                    required: [step, hypothesis, tool, result_summary]
                    properties:
                      step:
                        type: integer
                      hypothesis:
                        type: string
                      tool:
                        type: string
                      tool_args_summary:
                        type: string
                        nullable: true
                      result_summary:
                        type: string
                      duration_ms:
                        type: integer
                        nullable: true
            finding:
              type: object
              nullable: true
              properties:
                summary:
                  type: string
                recommendation:
                  type: string
                confidence:
                  type: number
                labels:
                  type: array
                  items:
                    type: object
                    required: [type, text]
                    properties:
                      type:
                        type: string
                        enum: [FACT, HYPOTHESIS]
                      text:
                        type: string
                evidence:
                  type: array
                  items:
                    type: object
                    required: [source_type, source_ref, quote]
                    properties:
                      source_type:
                        type: string
                        enum: [PO, GRN, CONTRACT, INVOICE]
                      source_ref:
                        type: string
                      page:
                        type: integer
                        nullable: true
                      quote:
                        type: string
            escalation:
              type: object
              nullable: true
              description: Terisi bila decision_status = ESCALATED atau pernah dieskalasi
              properties:
                by_name:
                  type: string
                reason:
                  type: string
                at:
                  type: string
                  format: date-time
            decisions:
              type: array
              description: Riwayat, urut waktu naik. Termasuk entri agent.
              items:
                type: object
                required: [id, actor, action, created_at]
                properties:
                  id:
                    type: string
                  actor:
                    type: object
                    required: [type, name]
                    properties:
                      type:
                        type: string
                        enum: [USER, AGENT]
                      id:
                        type: string
                      name:
                        type: string
                      role:
                        $ref: '#/components/schemas/Role'
                  action:
                    type: string
                    description: APPROVE, REJECT, ESCALATE, atau PROCESSED (entri agent)
                  reason:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
    Comparison:
      type: object
      nullable: true
      properties:
        tolerance_pct:
          type: number
          description: Toleransi harga yang berlaku saat invoice diproses
        lines:
          type: array
          items:
            type: object
            required: [line_no, item_name, status, diffs]
            properties:
              line_no:
                type: integer
              item_name:
                type: string
              po:
                type: object
                nullable: true
                properties:
                  quantity:
                    type: integer
                  unit_price:
                    type: integer
              grn:
                type: object
                nullable: true
                properties:
                  quantity_received:
                    type: integer
              invoice:
                type: object
                nullable: true
                properties:
                  quantity:
                    type: integer
                  unit_price:
                    type: integer
              status:
                type: string
                enum: [MATCH, MISMATCH]
              diffs:
                type: array
                items:
                  type: object
                  required: [type, expected, actual, within_tolerance]
                  properties:
                    type:
                      type: string
                      enum: [PRICE, QUANTITY, ITEM]
                    expected:
                      type: number
                    actual:
                      type: number
                    delta:
                      type: number
                    delta_pct:
                      type: number
                    within_tolerance:
                      type: boolean
        totals:
          type: object
          properties:
            po_total:
              type: integer
            grn_total_at_po_price:
              type: integer
            invoice_total:
              type: integer
            difference:
              type: integer
    DecisionRequest:
      type: object
      required: [action, reason]
      properties:
        action:
          $ref: '#/components/schemas/DecisionAction'
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    Metrics:
      type: object
      properties:
        invoices_total:
          type: integer
        avg_processing_seconds:
          type: number
        auto_clear_percent:
          type: number
        difference_caught_total:
          type: integer
          description: Rupiah
        escalation_rate_percent:
          type: number
        by_verdict:
          type: object
          properties:
            clean:
              type: integer
            exception:
              type: integer
            duplicate:
              type: integer
            needs_review:
              type: integer
        by_vendor:
          type: array
          items:
            type: object
            properties:
              vendor_name:
                type: string
              exception_count:
                type: integer
              difference_total:
                type: integer
        estimated_hours_saved:
          type: number
          nullable: true
          description: Dihitung dari manual_minutes_per_invoice di Pengaturan. Null bila belum diisi.
    Settings:
      type: object
      properties:
        price_tolerance_pct:
          type: number
          example: 0.5
        confidence_threshold:
          type: number
          example: 0.7
        max_iterations:
          type: integer
          readOnly: true
          example: 3
        manual_minutes_per_invoice:
          type: number
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          nullable: true
    SettingsUpdate:
      type: object
      properties:
        price_tolerance_pct:
          type: number
          minimum: 0
          maximum: 100
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
        manual_minutes_per_invoice:
          type: number
          minimum: 0
    AuditLog:
      type: object
      required: [id, created_at, actor, action, object_type, object_id]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        actor:
          type: object
          required: [type, name]
          properties:
            type:
              type: string
              enum: [USER, AGENT]
            id:
              type: string
            name:
              type: string
        action:
          type: string
          enum: [LOGIN, INVOICE_UPLOADED, INVOICE_PROCESSED, INVOICE_RETRY, DECISION_APPROVE, DECISION_REJECT, DECISION_ESCALATE, SETTINGS_UPDATED, USER_CREATED, USER_UPDATED, MASTER_IMPORTED, DEMO_RESET]
        object_type:
          type: string
          example: INVOICE
        object_id:
          type: string
        summary:
          type: string
        detail:
          type: object
          additionalProperties: true
    ImportResult:
      type: object
      required: [dry_run, valid_rows, invalid_rows]
      properties:
        dry_run:
          type: boolean
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        preview:
          type: array
          description: Beberapa baris pertama
          items:
            type: object
            additionalProperties: true
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              reason:
                type: string
